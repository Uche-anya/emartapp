# Upstreams are resolved per request through Docker's embedded DNS (127.0.0.11)
# rather than once at startup. The default nginx behaviour caches an upstream's
# IP when the config loads, which breaks two ways here: nginx won't start if a
# service isn't up yet (cold boot), and it keeps hitting a dead IP after a
# service is recreated with a new one (every deploy). Putting the hostname in a
# variable forces nginx to defer the lookup to request time, and the short valid
# time keeps it current as containers come and go.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $client_upstream client;
        proxy_pass http://$client_upstream:4200;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        set $api_upstream api;
        proxy_pass http://$api_upstream:5000;
    }

    location /webapi {
        set $webapi_upstream webapi;
        proxy_pass http://$webapi_upstream:9000;
    }
}
