name: Build and deploy emartapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC into AWS

env:
  AWS_REGION: eu-north-1

jobs:
  ci:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        # -backend=false so validation needs no AWS credentials or S3 access
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          # Reports findings without failing the run. The open SSH port is a
          # known, documented compromise, not a surprise to gate on.
          soft_fail: true

  build:
    name: Build ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client
            context: ./client
          - service: nodeapi
            context: ./nodeapi
          - service: javaapi
            context: ./javaapi

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/emartapp-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/emartapp-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the instance
        id: ec2
        run: |
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=emartapp-server" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "instance: $id"

      - name: Send the deploy command
        id: send
        env:
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}
        run: |
          # Runs as root under SSM, so hand the work to ubuntu: it owns the repo
          # checkout and is in the docker group, which keeps file ownership and
          # container ownership consistent with every previous deploy.
          script=$(cat <<EOF
          runuser -l ubuntu -c '
            set -e
            mkdir -p ~/microservices && cd ~/microservices
            [ -d emartapp ] || git clone https://github.com/${{ github.repository }}.git
            cd ~/microservices/emartapp
            git fetch origin main
            git reset --hard ${TAG}
            printf "REGISTRY=%s\nTAG=%s\n" "${REGISTRY}" "${TAG}" > .env
            docker compose pull
            docker compose up -d

            # nginx mounts its config from the repo and caches upstream IPs, so
            # a graceful reload picks up both a changed config and any container
            # that got a new IP during up -d. Falls back to a restart if the
            # container was itself just recreated.
            docker compose exec -T nginx nginx -s reload 2>/dev/null || docker compose restart nginx

            docker image prune -f
          '
          EOF
          )
          jq -n --arg s "$script" '{commands: [$s]}' > params.json
          cmd=$(aws ssm send-command \
            --instance-ids ${{ steps.ec2.outputs.id }} \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          echo "command: $cmd"

      - name: Wait for the command to finish
        run: |
          cmd=${{ steps.send.outputs.cmd }}
          id=${{ steps.ec2.outputs.id }}
          for i in $(seq 1 40); do
            status=$(aws ssm get-command-invocation \
              --command-id "$cmd" --instance-id "$id" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "attempt $i: $status"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "----- stderr -----"
                aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            sleep 15
          done
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
            --query 'StandardOutputContent' --output text

      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://${{ secrets.EC2_HOST }}" > /dev/null; then
              echo "up after $((i * 10))s"
              exit 0
            fi
            echo "attempt $i: not ready yet"
            sleep 10
          done
          echo "app never answered on port 80"
          exit 1
