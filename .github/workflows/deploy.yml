name: Deploy emartapp to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Docker Compose App
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2 through SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Creating microservices directory if missing..."
            mkdir -p ~/microservices
            cd ~/microservices

            echo "Checking if emartapp repo exists..."
            if [ ! -d "emartapp" ]; then
              echo "Repo not found. Cloning..."
              git clone https://github.com/Uche-anya/emartapp.git
            fi

            cd ~/microservices/emartapp

            echo "Pulling latest code from main..."
            git pull origin main

            echo "Stopping old containers..."
            docker compose down

            echo "Rebuilding and starting containers..."
            docker compose up -d --build

            echo "Checking running containers..."
            docker compose ps